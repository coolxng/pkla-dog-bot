name: Final verification polish

on:
  push:
    branches: [complete-discord-verification]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-discord-verification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply final source polish
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            receive_enabled = EXTERNAL_SAY_CONTROL_TOKEN and env_bool(\n                "ENABLE_LISTEN_IN", True\n            )\n',
              '            receive_enabled = EXTERNAL_SAY_CONTROL_TOKEN and env_bool(\n                "ENABLE_LISTEN_IN", False\n            )\n',
          )
          text = text.replace(
              '            "!memory, /search <query>, /help, /uptime, /coinflip, "\n',
              '            "/search <query>, /help, /uptime, /coinflip, "\n',
          )
          path.write_text(text, encoding="utf-8")

      - name: Verify final architecture
        run: |
          ! grep -nE 'POKE_INGEST_URL|post_message_to_poke|pingdeaf|intents\.message_content = True|intents\.members = True|default_state_store|AUTO_MEMORY_ENABLED|PERSIST_STATE|async def on_message|!memory' bot.py
          ! grep -n 'ENABLE_LISTEN_IN", True' bot.py
          test ! -f storage.py
          test ! -f tests/test_storage.py

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate
        run: |
          ruff check .
          mypy bot.py audio_relay.py pcm_relay.py browser_talk.py verification_entry.py
          python -m unittest discover -s tests

      - name: Commit polished source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-verification-polish.yml
          git add bot.py
          git commit -m "fix: finalize verification-safe defaults"
          git push origin HEAD:complete-discord-verification
