name: Final verification cleanup

on:
  push:
    branches: [remove-poke-pingdeaf]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-poke-pingdeaf
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove final stale reference
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(" /pingdeaf", "")
          path.write_text(text, encoding="utf-8")

      - name: Verify removed behavior and references are gone
        run: |
          if grep -RniE 'pingdeaf|POKE_INGEST_URL|post_message_to_poke|Poke ingest|use slurs, threats, and insults based on protected traits' \
            --exclude-dir=.git --exclude=final-verification-cleanup.yml .; then
            echo "Stale verification blocker reference remains"
            exit 1
          fi
          if grep -RniE '^import aiohttp$|^aiohttp==' --exclude-dir=.git .; then
            echo "Unused Poke HTTP dependency remains"
            exit 1
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate
        run: |
          ruff check .
          mypy bot.py audio_relay.py pcm_relay.py browser_talk.py
          python -m unittest discover -s tests

      - name: Commit final source and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-verification-cleanup.yml
          git add bot.py
          git commit -m "chore: finish verification source cleanup"
          git push origin HEAD:remove-poke-pingdeaf
