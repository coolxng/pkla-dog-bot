name: Final verification cleanup

on:
  push:
    branches: [remove-poke-pingdeaf]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-poke-pingdeaf
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove final stale references
        shell: python
        run: |
          from pathlib import Path

          bot_path = Path("bot.py")
          bot = bot_path.read_text(encoding="utf-8")
          bot_path.write_text(bot.replace(" /pingdeaf", ""), encoding="utf-8")

          stale_terms = ("pingdeaf", "poke_ingest_url", "poke ingest")
          for path in Path(".").glob("*.md"):
              lines = path.read_text(encoding="utf-8").splitlines()
              cleaned = [
                  line for line in lines
                  if not any(term in line.lower() for term in stale_terms)
              ]
              path.write_text("\n".join(cleaned).rstrip() + "\n", encoding="utf-8")

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate
        run: |
          ruff check .
          mypy bot.py audio_relay.py pcm_relay.py browser_talk.py
          python -m unittest discover -s tests

      - name: Commit final source and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-verification-cleanup.yml
          git add bot.py *.md
          git commit -m "chore: finish verification source cleanup"
          git push origin HEAD:remove-poke-pingdeaf
