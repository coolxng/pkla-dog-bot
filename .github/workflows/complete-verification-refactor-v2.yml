name: Complete Discord verification refactor v2

on:
  push:
    branches: [complete-discord-verification]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-discord-verification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply verification refactor
        run: python tools/complete_verification_refactor.py

      - name: Finalize generated source and tests
        shell: python
        run: |
          from pathlib import Path

          bot_path = Path("bot.py")
          text = bot_path.read_text(encoding="utf-8")
          for signature in (
              "def clean_reply(reply: str) -> str:\n",
              "def split_reply_chunks(text: str, limit: int = 2000) -> list[str]:\n",
              "async def run_discord_client(token: str) -> None:\n",
              "last_command_bark_at: dict[int, float] = {}\n",
          ):
              while text.count(signature) > 1:
                  first = text.find(signature)
                  second = text.find(signature, first + len(signature))
                  between = text[first + len(signature):second]
                  if between.strip():
                      break
                  text = text[:second] + text[second + len(signature):]

          text = text.replace(
              '    Path(__file__).with_name("assets") / "ryan-birthday.png.b64"\n',
              '    Path(__file__).with_name("static") / "favicon.png.b64"\n',
          )
          text = text.replace(
              'async def notify_voice_listen(voice_channel, message: str) -> None:\n    channel_id = voice_listen_notice_channels.get(voice_consent_key(voice_channel))\n',
              'async def notify_voice_listen(voice_channel, message: str) -> None:\n    try:\n        key = voice_consent_key(voice_channel)\n    except AttributeError:\n        return\n    channel_id = voice_listen_notice_channels.get(key)\n',
          )
          bot_path.write_text(text, encoding="utf-8")

          audio_tests_path = Path("tests/test_audio_relay.py")
          audio_tests = audio_tests_path.read_text(encoding="utf-8")
          audio_tests = audio_tests.replace(
              '        channel.guild = SimpleNamespace(id=9, voice_client=voice_client)\n        sink = object()\n        with (\n            patch.object(bot, "EXTERNAL_SAY_CONTROL_TOKEN", "secret"),\n',
              '        channel.guild = SimpleNamespace(id=9, voice_client=voice_client)\n        channel.members = [SimpleNamespace(id=42, bot=False)]\n        bot.voice_listen_consents[(9, 123)] = {42}\n        sink = object()\n        with (\n            patch.dict(bot.os.environ, {"ENABLE_LISTEN_IN": "true"}, clear=False),\n            patch.object(bot, "EXTERNAL_SAY_CONTROL_TOKEN", "secret"),\n',
              1,
          )
          audio_tests_path.write_text(audio_tests, encoding="utf-8")

          bot_tests_path = Path("tests/test_bot.py")
          bot_tests = bot_tests_path.read_text(encoding="utf-8")
          bot_tests = bot_tests.replace(
              '        self.assertIn("listen to live call audio in the browser", bot.SYSTEM_PROMPT)\n',
              '        self.assertIn("Browser listen-in is disabled by default", bot.SYSTEM_PROMPT)\n        self.assertIn("/listen-consent", bot.SYSTEM_PROMPT)\n',
          )
          bot_tests_path.write_text(bot_tests, encoding="utf-8")

      - name: Remove plaintext persistence implementation
        run: rm -f storage.py tests/test_storage.py

      - name: Verify blockers are absent from runtime source
        run: |
          ! grep -nE 'POKE_INGEST_URL|post_message_to_poke|pingdeaf|intents\.message_content = True|intents\.members = True|default_state_store|AUTO_MEMORY_ENABLED|PERSIST_STATE|async def on_message' bot.py
          ! grep -nE '^from storage|^import storage' bot.py

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and format fixes
        run: ruff check . --fix

      - name: Type check
        run: mypy bot.py audio_relay.py pcm_relay.py browser_talk.py verification_entry.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Final lint check
        run: ruff check .

      - name: Commit complete verification changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/complete-verification-refactor-v2.yml tools/complete_verification_refactor.py .ci-trigger-v3 || true
          git add -A
          git commit -m "feat: complete Discord verification hardening"
          git push origin HEAD:complete-discord-verification
