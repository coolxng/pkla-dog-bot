name: Complete Discord verification refactor

on:
  push:
    branches: [complete-discord-verification]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: complete-discord-verification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply verification refactor
        run: python tools/complete_verification_refactor.py

      - name: Remove plaintext persistence implementation
        run: |
          rm -f storage.py tests/test_storage.py

      - name: Verify verification blockers are absent
        run: |
          ! grep -RniE 'POKE_INGEST_URL|post_message_to_poke|pingdeaf|intents\.message_content = True|intents\.members = True|default_state_store|AUTO_MEMORY_ENABLED|PERSIST_STATE' \
            --exclude-dir=.git --exclude-dir=tools --exclude=complete-verification-refactor.yml .
          ! grep -RniE '@client\.event[[:space:]]*$' bot.py | grep -q 'on_message'
          ! grep -RniE '^from storage|^import storage' bot.py

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --fix

      - name: Type check
        run: mypy bot.py audio_relay.py pcm_relay.py browser_talk.py verification_entry.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Final lint check
        run: ruff check .

      - name: Commit complete verification changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/complete-verification-refactor.yml tools/complete_verification_refactor.py
          git add -A
          git commit -m "feat: complete Discord verification hardening"
          git push origin HEAD:complete-discord-verification
